org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

# ─────────────────────────────────────────────────────────────────────────────
# 工程目录名含非 ASCII 字符时，AGP 默认会直接拒绝构建：
#   "Your project path contains non-ASCII characters."
# 这是 AGP 在 Windows 上的保守策略 —— 老版本的 aapt2 处理非 ASCII 路径确实会出问题。
#
# 这里显式关掉这项检查。之所以敢关：
#   1. 工具链本身在纯 ASCII 路径下（JDK / SDK / Gradle 都装在纯 ASCII 路径）；
#   2. 源码与资源文件名全是 ASCII；
#   3. Gradle 已经强制 file.encoding=UTF-8。
# 如果将来 aapt2 在资源处理阶段报奇怪的错，第一个该怀疑的就是这一行 ——
# 到时把工程移到纯 ASCII 路径即可（比 debug 快得多）。
# ─────────────────────────────────────────────────────────────────────────────
android.overridePathCheck=true

kotlin.code.style=official
ksp.incremental=true
